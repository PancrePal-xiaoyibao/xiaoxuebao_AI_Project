services:
  xiaoxuebao-hermes:
    image: nousresearch/hermes-agent:v2026.6.5
    container_name: xiaoxuebao-hermes
    restart: unless-stopped
    command: gateway run
    user: "0:0"
    network_mode: host
    env_file:
      - ./.env
    environment:
      XIAOXUEBAO_ABILITY_PACK: /ability-pack
    volumes:
      - ./ability-pack:/ability-pack:ro
      - ./.env:/opt/data/.env:ro
      - ./profiles:/opt/data/profiles
